<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Hork — ad-hoc group chat for trips and conferences" />
    <!-- theme-color tracks surface.canvas (gray.50 / gray.900); synced at runtime for in-app color mode -->
    <meta name="theme-color" content="#FAF9FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221D33" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hork" />
    <title>Hork</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        /* surface.canvas light — overwritten by Chakra once hydrated */
        background-color: #faf9fc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #221d33;
        }
      }

      /* Fixed root stops iOS from focus-scrolling the layout viewport.
         Height tracks the visible viewport (--app-height) so no translate
         offset is needed when the keyboard opens. */
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--app-height, 100dvh);
        overflow: hidden;
        background-color: #faf9fc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
