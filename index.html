    <title>Yowl</title>
    <script>
      /* iOS home-screen web apps: classic 100vh includes the home-indicator band;
         bottom:0 / dvh / -webkit-fill-available use the lying viewport (WebKit 254868). */
      (function () {
        var standalone =
          (window.navigator && window.navigator.standalone === true) ||
          (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches);
        if (standalone) document.documentElement.classList.add('standalone');
      })();
    </script>
    <style>
      html {
        height: 100%;
      }

      html.standalone {
        /* Classic vh — not svh/dvh — fills under the home indicator in standalone */
        height: 100vh;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        /* surface.raised — Safari keyboard accessory / overscroll sample body */
        background-color: #302a44;
      }

      body {
        min-height: 100%;
      }

      html.standalone,
      html.standalone body {
        min-height: 100vh;
        height: 100vh;
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #ffffff;
        }

        #root {
          background-color: #faf9fc;
        }
      }

      /* Browser: inset stretch. Standalone: height 100vh (see html.standalone). */
      #root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        overflow: hidden;
        /* surface.canvas — app content plane */
        background-color: #221d33;
      }

      html.standalone #root {
        /* bottom:0 is capped to the lying viewport; 100vh is not (WebKit 254868) */
        bottom: auto;
        height: 100vh;
      }
    </style>

  <body>
    <div id="root"></div>
    <!-- Color mode before React; must be in body (touches document.body). -->
    <script id="chakra-script">
      !(function () {
        try {
          var raised = { light: '#ffffff', dark: '#302a44' };
          var canvas = { light: '#faf9fc', dark: '#221d33' };
          var apply = function (mode) {
            var prefersDark = window.matchMedia(
              '(prefers-color-scheme: dark)'
            ).matches;
            var resolved =
              mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
            var isDark = resolved === 'dark';
            var docColor = isDark ? raised.dark : raised.light;
            var appColor = isDark ? canvas.dark : canvas.light;
            var root = document.documentElement;
            var body = document.body;
            body.classList.add(isDark ? 'chakra-ui-dark' : 'chakra-ui-light');
            body.classList.remove(isDark ? 'chakra-ui-light' : 'chakra-ui-dark');
            root.style.colorScheme = resolved;
            root.dataset.theme = resolved;
            root.style.backgroundColor = docColor;
            body.style.backgroundColor = docColor;
            var app = document.getElementById('root');
            if (app) app.style.backgroundColor = appColor;
            return resolved;
          };
          var key = 'chakra-ui-color-mode';
          var stored = localStorage.getItem(key);
          if (stored) apply(stored);
          else localStorage.setItem(key, apply('system'));
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
