<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Yowl — ad-hoc group chat for trips and conferences" />
    <!-- theme-color tracks surface.canvas (gray.50 / gray.900); synced at runtime for in-app color mode -->
    <meta name="theme-color" content="#FAF9FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221D33" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yowl" />
    <title>Yowl</title>
    <script>
      /* iOS home-screen web apps: classic 100vh includes the home-indicator band;
         bottom:0 / dvh / -webkit-fill-available use the lying viewport (WebKit 254868). */
      (function () {
        var standalone =
          (window.navigator && window.navigator.standalone === true) ||
          (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches);
        if (standalone) document.documentElement.classList.add('standalone');
      })();
    </script>
    <style>
      html {
        height: 100%;
      }

      html.standalone {
        /* Classic vh — not svh/dvh — fills under the home indicator in standalone */
        height: 100vh;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        /* surface.canvas light — overwritten by Chakra once hydrated */
        background-color: #faf9fc;
      }

      body {
        min-height: 100%;
      }

      html.standalone,
      html.standalone body {
        min-height: 100vh;
        height: 100vh;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #221d33;
        }
      }

      /* Browser: inset stretch. Standalone: height 100vh (see html.standalone). */
      #root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        overflow: hidden;
        background-color: #faf9fc;
      }

      html.standalone #root {
        /* bottom:0 is capped to the lying viewport; 100vh is not (WebKit 254868) */
        bottom: auto;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
