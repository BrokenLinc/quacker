# Standalone Android PWA group-chat keyboard — light then dark in one run.
# Prefers an existing Home Screen / launcher icon; installs only if missing
# (same Install Yowl → Install → Add to home screen path as android-pwa-install-login).
# Screenshots: artifacts/maestro-android-pwa-keyboard-{,dark-}{closed,open,closed-after}
#
#   yarn test:maestro:android:pwa:keyboard
#
appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
# --- Launch standalone Yowl ---
- pressKey: Home
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Yowl"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      notVisible: "Yowl"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      visible: "Yowl"
    commands:
      - tapOn: "Yowl"
      - extendedWaitUntil:
          visible: ".*Sign in to Yowl|Your rooms|Account menu|Say something!|Back to home|Dark mode|Light mode|Close.*"
          timeout: 45000
# Install if launcher icon missing
- runFlow:
    when:
      notVisible: ".*Sign in to Yowl|Your rooms|Account menu|Say something!|Back to home|Dark mode|Light mode|Close.*"
    commands:
      - runFlow:
          file: android-chrome-open.yaml
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - extendedWaitUntil:
          visible: ".*Sign in to Yowl|Your rooms.*"
          timeout: 20000
      - runFlow:
          when:
            visible: "Sign in to Yowl"
          file: shared/login-steps.yaml
      - extendedWaitUntil:
          visible: "Install Yowl"
          timeout: 45000
      - tapOn: "Install app"
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Install"
          timeout: 15000
      - tapOn: "Install"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Add to home screen"
          commands:
            - tapOn: "Add to home screen"
            - waitForAnimationToEnd
      - pressKey: Home
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Yowl"
          timeout: 20000
      - tapOn: "Yowl"
      - extendedWaitUntil:
          visible: ".*Sign in to Yowl|Your rooms|Account menu|Say something!|Back to home|Dark mode|Light mode|Close.*"
          timeout: 45000
# Dismiss leftover Account sheet
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Dark mode"
    commands:
      - tapOn:
          point: "50%, 12%"
- runFlow:
    when:
      visible: "Light mode"
    commands:
      - tapOn:
          point: "50%, 12%"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
# --- Reach home signed-in ---
- runFlow:
    when:
      visible: "Sign in to Yowl"
    file: shared/login-steps.yaml
- runFlow:
    when:
      visible: "Back to home"
    commands:
      - tapOn: "Back to home"
- runFlow:
    when:
      visible: "Say something!"
    commands:
      - tapOn: "Back to home"
- runFlow:
    when:
      visible: "Sign in to Yowl"
    file: shared/login-steps.yaml
- extendedWaitUntil:
    visible: "Your rooms"
    timeout: 20000
# --- Group + keyboard light then dark ---
- tapOn: "New room"
- extendedWaitUntil:
    visible: "Room name"
    timeout: 10000
- tapOn: "Room name"
- eraseText
- inputText: "Android PWA Keyboard Lab"
- tapOn: "Create room"
- extendedWaitUntil:
    visible: "Say hi — this is the start of Android PWA Keyboard Lab"
    timeout: 20000
- assertVisible: "Android PWA Keyboard Lab options"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    file: shared/ensure-light-mode.yaml
- runFlow:
    file: android-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-android-pwa-keyboard
- runFlow:
    file: shared/ensure-dark-mode.yaml
- assertVisible: "Android PWA Keyboard Lab options"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- runFlow:
    file: android-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-android-pwa-keyboard-dark
