# Install Hork as a PWA from Android Chrome, then confirm the standalone app.
# Prefer APP_URL=http://localhost:<port> via adb reverse (secure context).
# Uses clearState so a prior "Dismiss install prompt" does not hide the banner.
#
#   yarn test:maestro:android:pwa
#
appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
- runFlow:
    file: android-chrome-open.yaml
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
# Keep install banner — do not dismiss it.
- extendedWaitUntil:
    visible: ".*Sign in to Hork|Your groups.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Sign in to Hork"
    file: shared/login-steps.yaml
- extendedWaitUntil:
    visible: "Your groups"
    timeout: 20000
- extendedWaitUntil:
    visible: "Install Hork"
    timeout: 45000
- tapOn: "Install app"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Install"
    timeout: 15000
- tapOn: "Install"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Add to home screen"
    commands:
      - tapOn: "Add to home screen"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Add"
    commands:
      - tapOn: "Add"
      - waitForAnimationToEnd
- pressKey: Home
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Hork"
    commands:
      - swipe:
          start: 50%, 90%
          end: 50%, 30%
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Hork"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      notVisible: "Hork"
    commands:
      - swipe:
          direction: LEFT
- extendedWaitUntil:
    visible: "Hork"
    timeout: 20000
- tapOn: "Hork"
- extendedWaitUntil:
    visible: ".*Sign in to Hork|Your groups.*"
    timeout: 45000
- runFlow:
    when:
      visible: "Sign in to Hork"
    file: shared/login-steps.yaml
- assertVisible: "Your groups"
