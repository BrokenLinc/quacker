# Sign in through Android Chrome using local test OTP (555-01XX / 555555).
# Requires: booted Play Store AVD (Chrome), Vite or preview + adb reverse, AUTH_ALLOW_TEST_OTP.
# Runner sets APP_URL=http://localhost:<port> via adb reverse (preferred).
#
#   yarn test:maestro:android
#
appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
- runFlow:
    file: android-chrome-open.yaml
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- extendedWaitUntil:
    visible: ".*All you need is a phone number:|Your rooms.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Your rooms"
    commands:
      - tapOn: "Account menu"
      - tapOn: "Log out"
      - extendedWaitUntil:
          visible: "All you need is a phone number:"
          timeout: 15000
- runFlow:
    file: shared/login-steps.yaml
- assertVisible: "Your rooms"
