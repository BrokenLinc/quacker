# Group chat layout with iOS virtual keyboard — light then dark in one run.
# Screenshots: artifacts/maestro-keyboard-{,dark-}{closed,open,closed-after}
#
#   yarn test:maestro:keyboard
#
appId: ${APP_ID}
---
- launchApp
- openLink: ${APP_URL}
- runFlow:
    file: shared/ensure-signed-in.yaml
- assertVisible: "Your rooms"
- tapOn: "New room"
- extendedWaitUntil:
    visible: "Room name"
    timeout: 10000
- tapOn: "WWDC hallway chat"
- eraseText
- inputText: "Keyboard Lab"
- tapOn: "Create room"
- extendedWaitUntil:
    visible: "Say hi — this is the start of Keyboard Lab"
    timeout: 20000
- assertVisible: "Keyboard Lab options"
- runFlow:
    file: shared/ensure-light-mode.yaml
- runFlow:
    file: ios-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-keyboard
- runFlow:
    file: shared/ensure-dark-mode.yaml
- assertVisible: "Keyboard Lab options"
- runFlow:
    file: ios-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-keyboard-dark
