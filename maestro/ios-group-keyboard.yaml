# Group chat layout with iOS virtual keyboard open + dismissed.
# Captures screenshots (closed + open) and asserts chrome/composer stay correct.
#
#   yarn test:maestro:keyboard
#
appId: com.apple.mobilesafari
---
- launchApp
- openLink: ${APP_URL}
- runFlow:
    file: ios-ensure-signed-in.yaml
- assertVisible: "Your groups"
- tapOn: "New group"
- extendedWaitUntil:
    visible: "Group name"
    timeout: 10000
- tapOn: "WWDC hallway chat"
- eraseText
- inputText: "Keyboard Lab"
- tapOn: "Create group"
# Title button is exposed as "{name} options"; empty-state copy also includes the name.
- extendedWaitUntil:
    visible: "Say hi — this is the start of Keyboard Lab"
    timeout: 20000
- assertVisible: "Keyboard Lab options"
- assertVisible: "Say something!"
- assertVisible: "Send"
- assertNotVisible: "return"
# Settle then capture keyboard-closed baseline (no soft keyboard keys).
- waitForAnimationToEnd
- takeScreenshot: artifacts/maestro-keyboard-closed
- tapOn: "Say something!"
# Soft keyboard is up (iOS exposes letter keys + return; space may be unlabeled).
- extendedWaitUntil:
    visible: "return"
    timeout: 10000
- waitForAnimationToEnd
# Composer must remain usable above the keyboard — no covered Send / missing title.
- assertVisible: "Send"
- assertVisible: "Say something!"
- assertVisible: "Keyboard Lab options"
- takeScreenshot: artifacts/maestro-keyboard-open
# Dismiss via the keyboard accessory Done control.
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
- waitForAnimationToEnd
# Layout restored: chrome + composer still on screen, keyboard gone.
- assertVisible: "Keyboard Lab options"
- assertVisible: "Say something!"
- assertVisible: "Send"
- assertNotVisible: "return"
- takeScreenshot: artifacts/maestro-keyboard-closed-after
