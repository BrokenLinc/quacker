# Group chat layout with iOS virtual keyboard open + dismissed.
# Asserts the composer stays above the keyboard and chrome restores after blur.
#
#   yarn test:maestro:keyboard
#
appId: com.apple.mobilesafari
---
- launchApp
- openLink: ${APP_URL}
- runFlow:
    file: ios-ensure-signed-in.yaml
- assertVisible: "Your groups"
- tapOn: "New group"
- extendedWaitUntil:
    visible: "Group name"
    timeout: 10000
- tapOn: "WWDC hallway chat"
- eraseText
- inputText: "Keyboard Lab"
- tapOn: "Create group"
# Title button is exposed as "{name} options"; empty-state copy also includes the name.
- extendedWaitUntil:
    visible: "Say hi — this is the start of Keyboard Lab"
    timeout: 20000
- assertVisible: "Keyboard Lab options"
- assertVisible: "Say something!"
- assertVisible: "Send"
- tapOn: "Say something!"
# Soft keyboard is up (iOS exposes letter keys + return; space may be unlabeled).
- extendedWaitUntil:
    visible: "return"
    timeout: 10000
- assertVisible: "Send"
- assertVisible: "Say something!"
- assertVisible: "Keyboard Lab options"
# Dismiss via the keyboard accessory Done control.
- tapOn: "Done"
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
# Layout restored: chrome + composer still on screen, keyboard gone.
- assertVisible: "Keyboard Lab options"
- assertVisible: "Say something!"
- assertVisible: "Send"
- assertNotVisible: "return"
