# Sign in through MobileSafari using local test OTP (555-01XX / 555555).
# Requires: booted iOS Simulator, Vite on LAN (--host 0.0.0.0), AUTH_ALLOW_TEST_OTP.
# Note: clearState is not used — Safari is a system app and cannot be uninstalled.
#
#   yarn test:maestro
#
appId: ${APP_ID}
---
- launchApp
- openLink: ${APP_URL}
- runFlow:
    when:
      visible: "Close"
    commands:
      # Optional: the guard's hierarchy snapshot can go stale before the tap lands.
      - tapOn:
          text: "Close"
          optional: true
- extendedWaitUntil:
    visible: ".*All you need is a phone number:|Your rooms.*"
    timeout: 20000
# Clear a leftover session so this flow always exercises OTP.
- runFlow:
    when:
      visible: "Your rooms"
    commands:
      - tapOn: "Account menu"
      - tapOn: "Log out"
      - extendedWaitUntil:
          visible: "All you need is a phone number:"
          timeout: 15000
- runFlow:
    file: shared/login-steps.yaml
- assertVisible: "Your rooms"
