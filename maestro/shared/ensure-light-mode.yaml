appId: ${APP_ID}
---
# Force light via Account menu (mobile color-mode row), then leave menu closed.
# Env: APP_ID (com.apple.mobilesafari | com.android.chrome)
# Dismiss: Close if present, else tap overlay above the floating sheet.
- tapOn: "Account menu"
- extendedWaitUntil:
    visible: ".*Dark mode|Light mode.*"
    timeout: 10000
- runFlow:
    when:
      visible: "Light mode"
    commands:
      - tapOn: "Light mode"
      - waitForAnimationToEnd
      - tapOn: "Account menu"
      - extendedWaitUntil:
          visible: "Dark mode"
          timeout: 10000
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Dark mode"
    commands:
      - tapOn:
          point: "50%, 12%"
- waitForAnimationToEnd
