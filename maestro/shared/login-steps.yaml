appId: ${APP_ID}
---
# Shared sign-in steps (test OTP). Invoked from flows that may already be on the form.
# Env: APP_ID (com.apple.mobilesafari | com.android.chrome)
# Prefer label text — Android Chrome WebView often omits input placeholders from a11y.
- tapOn: "All you need is a phone number:"
- eraseText
- inputText: "2025550100"
- tapOn: "Text me a code"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Text me a code"
    commands:
      - tapOn: "Text me a code"
- extendedWaitUntil:
    visible: "Verification code"
    timeout: 20000
- tapOn:
    text: "Please enter your pin code"
    index: 0
- inputText: "5"
- inputText: "5"
- inputText: "5"
- inputText: "5"
- inputText: "5"
- inputText: "5"
- runFlow:
    when:
      visible: "Verify"
    commands:
      - tapOn: "Verify"
# FTUE: name step (new users) then optional create-room; Skip lands on home.
- runFlow:
    when:
      visible: "What's your name?"
    commands:
      - tapOn: "What's your name?"
      - inputText: "Maestro"
      - tapOn: "Next"
- runFlow:
    when:
      visible: "Start a chat room"
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Your rooms"
    timeout: 20000
