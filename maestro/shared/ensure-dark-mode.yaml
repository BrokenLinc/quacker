appId: ${APP_ID}
---
# Switch to dark via Account menu (assumes currently light). Verify it stuck.
# Env: APP_ID (com.apple.mobilesafari | com.android.chrome)
# Dismiss: Close if present, else tap overlay above the floating sheet.
- tapOn: "Account menu"
- extendedWaitUntil:
    visible: "Dark mode"
    timeout: 10000
- tapOn: "Dark mode"
- extendedWaitUntil:
    notVisible: "Account"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Account menu"
- extendedWaitUntil:
    visible: "Light mode"
    timeout: 10000
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Light mode"
    commands:
      - tapOn:
          point: "50%, 12%"
- waitForAnimationToEnd
