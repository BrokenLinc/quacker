appId: ${APP_ID}
---
# Switch to dark via Account menu (assumes currently light). Verify it stuck.
# Env: APP_ID (com.apple.mobilesafari | com.android.chrome)
# Dismiss: Close if present, else tap the overlay left of the panel. Tapping
# 50%,12% can land on the panel's own color-mode row and toggle it straight back.
- tapOn: "Account menu"
- extendedWaitUntil:
    visible: "Dark mode"
    timeout: 10000
- tapOn: "Dark mode"
- extendedWaitUntil:
    notVisible: "Account"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Account menu"
- extendedWaitUntil:
    visible: "Light mode"
    timeout: 10000
- runFlow:
    when:
      visible: "Close"
    commands:
      # Optional: the guard's hierarchy snapshot can go stale before the tap lands.
      - tapOn:
          text: "Close"
          optional: true
- runFlow:
    when:
      visible: "Light mode"
    commands:
      - tapOn:
          point: "6%, 20%"
- waitForAnimationToEnd
