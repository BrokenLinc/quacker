# Group chat layout with Android Chrome virtual keyboard — light then dark in one run.
# Screenshots: artifacts/maestro-android-keyboard-{,dark-}{closed,open,closed-after}
#
#   yarn test:maestro:android:keyboard
#
appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
- runFlow:
    file: android-chrome-open.yaml
- runFlow:
    file: shared/ensure-signed-in.yaml
- assertVisible: "Your rooms"
- tapOn: "New room"
- extendedWaitUntil:
    visible: "Room name"
    timeout: 10000
- tapOn: "Room name"
- eraseText
- inputText: "Android Keyboard Lab"
- tapOn: "Create room"
- extendedWaitUntil:
    visible: "Say hi — this is the start of Android Keyboard Lab"
    timeout: 20000
- assertVisible: "Android Keyboard Lab options"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    file: shared/ensure-light-mode.yaml
- runFlow:
    file: android-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-android-keyboard
- runFlow:
    file: shared/ensure-dark-mode.yaml
- assertVisible: "Android Keyboard Lab options"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- runFlow:
    file: android-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-android-keyboard-dark
