appId: com.apple.mobilesafari
---
# Ensure signed in with test OTP. Logs out first if already on home.
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- extendedWaitUntil:
    visible: ".*Sign in to Hork|Your groups.*"
    timeout: 20000
- runFlow:
    when:
      visible: "Your groups"
    commands:
      - tapOn: "Account menu"
      - tapOn: "Log out"
      - extendedWaitUntil:
          visible: "Sign in to Hork"
          timeout: 15000
- runFlow:
    file: ios-safari-login-steps.yaml
