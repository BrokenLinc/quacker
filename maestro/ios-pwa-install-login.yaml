# Install Yowl as a PWA from MobileSafari, then confirm the standalone app.
# Flakier than ios-safari-login.yaml (Share sheet / Add dialog a11y vary by iOS).
# Prefer a contained share-sheet swipe over "View More" (hit target flaky on iOS 26).
#
#   yarn test:maestro:pwa
#
appId: ${APP_ID}
---
- launchApp
- openLink: ${APP_URL}
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- extendedWaitUntil:
    visible: ".*All you need is a phone number:|Your rooms.*"
    timeout: 20000
- tapOn: "More"
- tapOn:
    id: "ShareButton"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- waitForAnimationToEnd
- swipe:
    start: 50%, 88%
    end: 50%, 45%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Add to Home Screen"
    timeout: 15000
- tapOn: "Add to Home Screen"
- waitForAnimationToEnd
# Name field autofocuses; a11y often omits the top-right Add — tap by position.
- tapOn:
    point: "92%,12%"
- waitForAnimationToEnd
- pressKey: Home
- runFlow:
    when:
      notVisible: "Yowl"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      notVisible: "Yowl"
    commands:
      - swipe:
          direction: LEFT
- extendedWaitUntil:
    visible: "Yowl"
    timeout: 20000
- tapOn: "Yowl"
- extendedWaitUntil:
    visible: ".*All you need is a phone number:|Your rooms.*"
    timeout: 45000
- runFlow:
    when:
      visible: "All you need is a phone number:"
    file: shared/login-steps.yaml
- assertVisible: "Your rooms"
