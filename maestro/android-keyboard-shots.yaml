appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
# Keyboard closed → open → closed screenshots + layout asserts (Android IME).
# Env: SHOT_PREFIX (e.g. maestro-android-keyboard), APP_ID
# When the composer is focused, Android Chrome often drops the placeholder /
# aria-label from the a11y tree — assert Send instead while open.
- assertVisible: "Say something!"
- assertVisible: "Send"
- waitForAnimationToEnd
- takeScreenshot: artifacts/${SHOT_PREFIX}-closed
- tapOn: "Say something!"
- waitForAnimationToEnd
- assertVisible: "Send"
- takeScreenshot: artifacts/${SHOT_PREFIX}-open
- pressKey: back
- extendedWaitUntil:
    visible: "Say something!"
    timeout: 15000
- waitForAnimationToEnd
- assertVisible: "Say something!"
- assertVisible: "Send"
- takeScreenshot: artifacts/${SHOT_PREFIX}-closed-after
