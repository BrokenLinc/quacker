# Standalone PWA group-chat keyboard — light then dark in one run.
# Prefers an existing Home Screen icon; installs only if missing.
# Screenshots: artifacts/maestro-pwa-keyboard-{,dark-}{closed,open,closed-after}
#
#   yarn test:maestro:pwa:keyboard
#
appId: ${APP_ID}
---
# --- Launch standalone Yowl ---
- pressKey: Home
- runFlow:
    when:
      notVisible: "Yowl"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      notVisible: "Yowl"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      visible: "Yowl"
    commands:
      - tapOn: "Yowl"
      - extendedWaitUntil:
          visible: ".*Sign in to Yowl|Your rooms|Account menu|Say something!|Back to home|Dark mode|Light mode|Close.*"
          timeout: 45000
- runFlow:
    when:
      notVisible: ".*Sign in to Yowl|Your rooms|Account menu|Say something!|Back to home|Dark mode|Light mode|Close.*"
    commands:
      - launchApp
      - openLink: ${APP_URL}
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - runFlow:
          when:
            visible: "Dismiss install prompt"
          commands:
            - tapOn: "Dismiss install prompt"
      - extendedWaitUntil:
          visible: ".*Sign in to Yowl|Your rooms.*"
          timeout: 20000
      - tapOn: "More"
      - tapOn:
          id: "ShareButton"
      - extendedWaitUntil:
          visible: "Copy"
          timeout: 10000
      - waitForAnimationToEnd
      - swipe:
          start: 50%, 88%
          end: 50%, 45%
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Add to Home Screen"
          timeout: 15000
      - tapOn: "Add to Home Screen"
      - waitForAnimationToEnd
      - tapOn:
          point: "92%,12%"
      - waitForAnimationToEnd
      - pressKey: Home
      - runFlow:
          when:
            notVisible: "Yowl"
          commands:
            - swipe:
                direction: LEFT
      - runFlow:
          when:
            notVisible: "Yowl"
          commands:
            - swipe:
                direction: LEFT
      - extendedWaitUntil:
          visible: "Yowl"
          timeout: 20000
      - tapOn: "Yowl"
      - extendedWaitUntil:
          visible: ".*Sign in to Yowl|Your rooms|Account menu|Say something!|Back to home|Dark mode|Light mode|Close.*"
          timeout: 45000
# Dismiss leftover Account sheet from a prior interrupted run.
- runFlow:
    when:
      visible: "Dark mode"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Light mode"
    commands:
      - tapOn: "Close"
# --- Reach home signed-in ---
- runFlow:
    when:
      visible: "Sign in to Yowl"
    file: shared/login-steps.yaml
- runFlow:
    when:
      visible: "Back to home"
    commands:
      - tapOn: "Back to home"
- runFlow:
    when:
      visible: "Say something!"
    commands:
      - tapOn: "Back to home"
# Session may have been cleared (webclip storage wipe) after navigating home.
- runFlow:
    when:
      visible: "Sign in to Yowl"
    file: shared/login-steps.yaml
- extendedWaitUntil:
    visible: "Your rooms"
    timeout: 20000
# --- Group + keyboard light then dark ---
- tapOn: "New room"
- extendedWaitUntil:
    visible: "Room name"
    timeout: 10000
- tapOn: "WWDC hallway chat"
- eraseText
- inputText: "PWA Keyboard Lab"
- tapOn: "Create room"
- extendedWaitUntil:
    visible: "Say hi — this is the start of PWA Keyboard Lab"
    timeout: 20000
- assertVisible: "PWA Keyboard Lab options"
- runFlow:
    file: shared/ensure-light-mode.yaml
- runFlow:
    file: ios-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-pwa-keyboard
- runFlow:
    file: shared/ensure-dark-mode.yaml
- assertVisible: "PWA Keyboard Lab options"
- runFlow:
    file: ios-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-pwa-keyboard-dark
