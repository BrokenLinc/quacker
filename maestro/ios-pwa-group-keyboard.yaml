# Standalone PWA group-chat keyboard — light then dark in one run (install once).
# Screenshots: artifacts/maestro-pwa-keyboard-{,dark-}{closed,open,closed-after}
#
#   yarn test:maestro:pwa:keyboard
#
appId: com.apple.mobilesafari
---
- launchApp
- openLink: ${APP_URL}
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Dismiss install prompt"
    commands:
      - tapOn: "Dismiss install prompt"
- extendedWaitUntil:
    visible: ".*Sign in to Hork|Your groups.*"
    timeout: 20000
- tapOn: "More"
- tapOn:
    id: "ShareButton"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 10000
- waitForAnimationToEnd
# Expand actions without relying on flaky "View More" hit targets.
- swipe:
    start: 50%, 88%
    end: 50%, 45%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Add to Home Screen"
    timeout: 15000
- tapOn: "Add to Home Screen"
- waitForAnimationToEnd
# iOS 26 Add-to-Home dialog: name field focuses keyboard; a11y tree often omits Add.
# Tap Add by position — below status bar, top-right of the sheet (not 7% — that hits the status bar).
- tapOn:
    point: "92%,12%"
- waitForAnimationToEnd
- pressKey: Home
- runFlow:
    when:
      notVisible: "Hork"
    commands:
      - swipe:
          direction: LEFT
- runFlow:
    when:
      notVisible: "Hork"
    commands:
      - swipe:
          direction: LEFT
- extendedWaitUntil:
    visible: "Hork"
    timeout: 20000
- tapOn: "Hork"
- extendedWaitUntil:
    visible: ".*Sign in to Hork|Your groups.*"
    timeout: 45000
- runFlow:
    when:
      visible: "Sign in to Hork"
    file: ios-safari-login-steps.yaml
- assertVisible: "Your groups"
- tapOn: "New group"
- extendedWaitUntil:
    visible: "Group name"
    timeout: 10000
- tapOn: "WWDC hallway chat"
- eraseText
- inputText: "PWA Keyboard Lab"
- tapOn: "Create group"
- extendedWaitUntil:
    visible: "Say hi — this is the start of PWA Keyboard Lab"
    timeout: 20000
- assertVisible: "PWA Keyboard Lab options"
- runFlow:
    file: ios-ensure-light-mode.yaml
- runFlow:
    file: ios-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-pwa-keyboard
- runFlow:
    file: ios-ensure-dark-mode.yaml
- assertVisible: "PWA Keyboard Lab options"
- runFlow:
    file: ios-keyboard-shots.yaml
    env:
      SHOT_PREFIX: maestro-pwa-keyboard-dark
